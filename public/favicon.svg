<!--
  The association badge reduced to what still reads at 16px: the laurel wreath
  as two crescents open at the top and bottom, the crimson disc, the crossed
  cues, and three of the balls. Colours are sampled from public/logo.png.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Southern Division Billiards and Snooker Association Fiji">
  <g fill="#00a551">
    <!-- Right half of the wreath -->
    <path d="M37.56 0.5A32 32 0 0 1 37.56 63.5L36.86 58.4A27 27 0 0 0 36.86 5.6Z" />
    <!-- Left half -->
    <path d="M26.44 63.5A32 32 0 0 1 26.44 0.5L27.14 5.6A27 27 0 0 0 27.14 58.4Z" />
  </g>

  <circle cx="32" cy="32" r="25.5" fill="#ec1f24" />

  <!-- Crossed cues -->
  <g stroke="#e8d7a6" stroke-width="2.2" stroke-linecap="round">
    <path d="M23 45 41 17" />
    <path d="M41 45 23 17" />
  </g>

  <!-- Yellow, black and white off the ball cluster -->
  <circle cx="19.5" cy="30" r="5.5" fill="#fff100" />
  <circle cx="44.5" cy="30" r="5.5" fill="#211f20" />
  <circle cx="32" cy="46" r="5.5" fill="#ffffff" />
</svg>
