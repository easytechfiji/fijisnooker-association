<!--
  Simplified version of the association badge, drawn as vectors so it stays
  legible at 16px where the photographic logo (public/logo.jpg) turns to mush.
  Same four elements, same colours: the sun, the sea, the table, the palm.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Billiards & Snooker Association of Fiji">
  <defs>
    <clipPath id="disc">
      <circle cx="32" cy="32" r="26" />
    </clipPath>
  </defs>

  <circle cx="32" cy="32" r="32" fill="#0b3826" />
  <circle cx="32" cy="32" r="26" fill="#fbf8f0" />

  <g clip-path="url(#disc)">
    <!-- Sun -->
    <circle cx="32" cy="28" r="21" fill="#f0c419" />

    <!-- Sea -->
    <path d="M6 44c5 0 5-3 10-3s5 3 10 3 5-3 10-3 5 3 10 3 5-3 10-3v20H6Z" fill="#2aa7cf" />

    <!-- Table -->
    <rect x="15" y="35" width="25" height="4.5" rx="1" fill="#141414" />
    <rect x="17.5" y="39.5" width="2.5" height="7" fill="#141414" />
    <rect x="35" y="39.5" width="2.5" height="7" fill="#141414" />

    <!-- Palm -->
    <path d="M45.6 22.5 44 47h3l1.4-24.5Z" fill="#1a7a3c" />
    <g fill="#1a7a3c">
      <path d="M46 21c-4.4-2.6-9-2-11.4 1.4 3-1.4 6.2-1 8.6.8Z" />
      <path d="M46 21c-2-4.7-6-7-10-6 3.2.6 6 3 7.6 6.6Z" />
      <path d="M46 21c4.6-2.2 9.2-1.2 11.4 2.4-2.8-1.8-6.2-1.8-8.8-.2Z" />
      <path d="M46 21c1.4-4.9 5-7.7 9.2-7.2-3.2 1-5.8 3.6-6.8 7.4Z" />
    </g>
  </g>

  <circle cx="32" cy="32" r="26" fill="none" stroke="#0b3826" stroke-width="2.5" />
  <circle cx="32" cy="32" r="30" fill="none" stroke="#f0c419" stroke-width="1.5" />
</svg>
